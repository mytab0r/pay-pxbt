name: image
# ghcr.io/mytab0r/pay-pxbt-app:latest — только после зелёного ci на master; Watchtower на VPS подтянет.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [master, main]
  # ручной ребилд :latest из выбранной ветки (github.sha), без stale-guard
  workflow_dispatch:
  # развязка от общего ci: pay/ImageInputs меняются -> push-path деплой без контент-тестов (t_pay-decouple)
  push:
    branches: [master]
    paths: ["deploy/pay-page/**", "functions/**", "config/payment-providers.json"]
jobs:
  build-push:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      pushed: ${{ steps.fresh.outputs.ok }}
      sha: ${{ env.SHA }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # root-cause t_88af3bec: ci-очередь на self-hosted держит push-ci часами; поздно завершившийся ci старого
      # push (25.10, 88bfdd7 до фикса #257) перезаписал :latest устаревшим кодом.
      # Точное head_sha == HEAD оказалось недостижимо: бот коммитит `[skip ci]` (mood rotation) в master, ci на
      # них не идёт -> 13 ч после #308 ни одной fresh-сборки. Поэтому stale = HEAD ветки содержит изменения
      # входов образа (IMAGE_INPUTS = источники COPY в Dockerfile) после head_sha; иначе образ из head_sha
      # идентичен HEAD -> собираем. compare не ahead / >=300 файлов / API не ответил -> fail-closed (skip/fail).
      # Инвариант IMAGE_INPUTS <-> Dockerfile: pipeline/test_pay_image_guard.py.
      - name: stale guard (входы образа не менялись после head_sha)
        id: fresh
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_INPUTS: "deploy/pay-page/ functions/ config/payment-providers.json"
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; echo "workflow_dispatch: guard пропущен, собираю $SHA"; exit 0; fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; echo "push-path: guard пропущен, head_sha == HEAD"; exit 0; fi
          for n in 1 2 3; do
            cmp=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/compare/$SHA...$BRANCH") && break
            [ $n = 3 ] && { echo "compare $SHA...$BRANCH не ответил"; exit 1; }; sleep $((n*10))
          done
          verdict=$(printf '%s' "$cmp" | python3 -c '
          import json, os, sys
          c = json.load(sys.stdin); pre = tuple(os.environ["IMAGE_INPUTS"].split())
          files = [f["filename"] for f in c.get("files", [])]
          hit = [f for f in files if f.startswith(pre)]
          head = c["commits"][-1]["sha"] if c.get("commits") else os.environ["SHA"]
          if c.get("status") not in ("ahead", "identical") or len(files) >= 300: print("stale", head, "compare status=%s files=%d" % (c.get("status"), len(files)))
          elif hit: print("stale", head, "входы образа изменены: " + " ".join(hit[:5]))
          else: print("fresh", head, "behind=%d, входы образа не менялись" % c.get("ahead_by", 0))
          ')
          set -- $verdict; state=$1; head=$2; shift 2
          if [ "$state" = fresh ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; echo "fresh: $SHA ~ HEAD $BRANCH $head ($*)"
          else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::stale: head_sha $SHA != HEAD $BRANCH $head ($*) — skip build/push"; fi
      - uses: actions/checkout@v4
        if: steps.fresh.outputs.ok == 'true'
        with:
          ref: ${{ env.SHA }}
      # root-cause: t_831d9fd6 -- docker/login-action runs `docker login`, i.e. one daemon-side ping of
      # https://ghcr.io/v2/ through Docker Desktop's http.docker.internal:3128 with a hard ~15s timeout and no
      # retry; PC egress stalls fail the job ("Client.Timeout exceeded while awaiting headers", 11 runs 16-21.10).
      # Creds are client-side anyway: write them to a per-job DOCKER_CONFIG, buildx sends them per request.
      - name: ghcr auth (client-side config, no daemon ping)
        if: steps.fresh.outputs.ok == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          d="$RUNNER_TEMP/docker"; mkdir -p "$d"; echo "DOCKER_CONFIG=$d" >> "$GITHUB_ENV"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$(printf '%s:%s' "$GITHUB_ACTOR" "$GHCR_TOKEN" | base64 -w0)" > "$d/config.json"
      # root-cause t_a41372f5: docker-container драйвер = пустой BuildKit на каждый прогон, база node:22-alpine
      # каждый раз заново с CloudFront Docker Hub (обрывы -> httpReadSeeker unexpected EOF). docker-драйвер
      # берёт слои из store демона ПК, где ci/pay-image-smoke уже собрал этот Dockerfile.
      - uses: docker/setup-buildx-action@v3
        if: steps.fresh.outputs.ok == 'true'
        with:
          driver: docker
      # root-cause t_0a4cae59: transport-обрывы egress ПК (WSL NAT / Docker Desktop proxy) роняли сборку на
      # живом GET слоя базы (httpReadSeeker unexpected EOF -> failed to compute cache key) и push к ghcr
      # (oauth token EOF). driver=docker (t_a41372f5) убрал пустой BuildKit, но базу, которой нет в store,
      # демон всё равно тянет одним GET без ретраев. Механика класса: 1) базу тянем отдельно с 4 попытками
      # (слои докачиваются, не дублируются), как в ci/e2e-admin; 2) build-push повторяем целиком до 4 раз
      # только на transport-ошибках registry (EOF / timeout / connection reset), не маскируя другие отказы.
      - name: pre-pull base (4 attempts, resumable layers)
        if: steps.fresh.outputs.ok == 'true'
        run: |
          B=$(sed -n 's/^FROM //p' deploy/pay-page/Dockerfile | head -1)
          for n in 1 2 3 4; do docker pull -q "$B" && break; [ $n = 4 ] && exit 1; echo "pull $B: попытка $n не удалась, повтор через $((n*20)) с"; sleep $((n*20)); done
      # root-cause t_1b6fdb47: workflow_dispatch минует ci -> образ с SyntaxError ушёл в :latest, прод в crashloop.
      # Синтаксис сервера проверяем до push на любом событии.
      - name: syntax gate (node --check server.mjs)
        if: steps.fresh.outputs.ok == 'true'
        run: |
          B=$(sed -n 's/^FROM //p' deploy/pay-page/Dockerfile | head -1)
          # stdin, не bind-mount: демон Docker Desktop не видит FS раннера
          docker run --rm -i "$B" sh -c 'cat > /tmp/s.mjs && node --check /tmp/s.mjs' < deploy/pay-page/server.mjs
          # push-path сборка идёт мимо e2e-admin: синтаксис каждого functions/*.js проверяем здесь (t_pay-decouple)
          for f in $(git ls-files 'functions/*.js' 'functions/**/*.js'); do
            docker run --rm -i "$B" sh -c 'cat > /tmp/s.js && node --check /tmp/s.js' < "$f" || { echo "::error::SyntaxError: $f"; exit 1; }
          done
      - name: build + push (retry on registry transport errors only)
        if: steps.fresh.outputs.ok == 'true'
        run: |
          set -e
          for n in 1 2 3 4; do
            if docker buildx build --push \
                 -f deploy/pay-page/Dockerfile \
                 --build-arg GIT_SHA=${{ env.SHA }} \
                 -t ghcr.io/${{ github.repository_owner }}/pay-pxbt-app:latest \
                 -t ghcr.io/${{ github.repository_owner }}/pay-pxbt-app:sha-${{ env.SHA }} \
                 .; then exit 0; fi
            [ $n = 4 ] && exit 1
            echo "build-push: попытка $n не удалась, повтор через $((n*20)) с"; sleep $((n*20))
          done

  deploy-verify:
    needs: build-push
    if: needs.build-push.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # t_1b6fdb47: логика в скрипте, чтобы ветку таймаут->TG-алерт гонял pipeline/test_pay_deploy_verify.py.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-push.outputs.sha }}
          sparse-checkout: deploy/pay-page
      - name: wait for deploy & verify healthz sha (15 min, TG alert on timeout)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          WANT_SHA: ${{ needs.build-push.outputs.sha }}
        run: bash deploy/pay-page/deploy_verify.sh
