# ============================================================
# pc-ops: ограниченный доступ агента (сервер 1 vCPU) к GPU-ПК.
# Только: контейнеры/образы/volumes (просмотр), POST /build,
# POST /containers/create, image push, logs.
# EXEC/START/STOP/WAIT — ЗАПРЕЩЕНЫ на стороне прокси.
# ============================================================
services:
  ace-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: ace-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      BUILD: 1
      VOLUMES: 1
      NETWORKS: 1
      EXEC: 0
      ALLOW_START: 0
      ALLOW_STOP: 0
      ALLOW_RESTARTS: 1
      LOG: 1
      INFO: 1
      PING: 1
      VERSION: 1
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock
    networks: [acenet]

  ace-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: ace-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    depends_on: [ace-proxy]
    networks: [acenet]

networks:
  acenet: {}
