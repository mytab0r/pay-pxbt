# Прод на VPS: образ из GHCR (CI пушит :latest из master), Watchtower сам подтягивает обновления.
# Секреты/данные — в ./data (вне git, secrets.json chmod 600). Env — в .env рядом (вне git).
services:
  pay:
    image: ghcr.io/mytab0r/pay-pxbt:latest
    restart: unless-stopped
    env_file: .env          # OWNER_EMAIL, CF_ACCESS_TEAM_DOMAIN, CF_ACCESS_AUD, PAY_API_TOKEN
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8090:8080"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
