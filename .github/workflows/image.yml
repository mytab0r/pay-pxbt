name: image
# ghcr.io/mytab0r/pay-pxbt-app:latest — имя образа не меняется, чтобы VPS и Watchtower
# продолжили подтягивать обновления без правок compose.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/pay-page/Dockerfile
          push: true
          tags: ghcr.io/mytab0r/pay-pxbt-app:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
